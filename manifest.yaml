# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json
kind: AIchorManifest
apiVersion: 0.2.3
builder:
  image: proteobench-instanovo-v1-2-2
  dockerfile: ./aichor/instanovo_v1_2_2/Dockerfile
  context: .
spec:
  operator: jobset
  image: proteobench-instanovo-v1-2-2
  # Paired significance tests across all seven inference modes. The earlier paired-stats
  # run covered only greedy, greedy_refined, beam10 and beam10_refined; this adds the two
  # knapsack modes and diffusion_only so every pair in the results table is tested.
  # No GPU: this only streams two columns out of each mode's intermediate.csv.
  command: >-
    cd /workspace/ProteoBench/aichor/instanovo_v1_2_2 &&
    python paired_stats.py
    --intermediate greedy=s3://dtu-denovo-s-2e6da747d6d34f62-outputs/output/8b794fca-7218-4659-bc18-251bfde58a52/instanovo_v1_2_2_metrics/runs/greedy/intermediate.csv
    --intermediate greedy_refined=s3://dtu-denovo-s-2e6da747d6d34f62-outputs/output/0c4467e7-c43a-4fe6-9a86-e44d8bc3552c/instanovo_v1_2_2_metrics/runs/greedy_refined/intermediate.csv
    --intermediate beam10=s3://dtu-denovo-s-2e6da747d6d34f62-outputs/output/e3543482-6b63-4467-87ac-868cddd7ae04/instanovo_v1_2_2_metrics/runs/beam10/intermediate.csv
    --intermediate beam10_refined=s3://dtu-denovo-s-2e6da747d6d34f62-outputs/output/b1047c55-5075-413f-b8e6-19e53b1ff2a2/instanovo_v1_2_2_metrics/runs/beam10_refined/intermediate.csv
    --intermediate knapsack_beam10=s3://dtu-denovo-s-2e6da747d6d34f62-outputs/output/4670d80d-a3e8-4998-a97e-63eb6a933cb8/instanovo_v1_2_2_metrics/runs/knapsack_beam10/intermediate.csv
    --intermediate knapsack_beam10_refined=s3://dtu-denovo-s-2e6da747d6d34f62-outputs/output/42638121-f931-49d1-b16f-81fb3abeda30/instanovo_v1_2_2_metrics/runs/knapsack_beam10_refined/intermediate.csv
    --intermediate diffusion_only=s3://dtu-denovo-s-2e6da747d6d34f62-outputs/output/013f843b-2624-4a80-8cee-ccaacc1a0342/instanovo_v1_2_2_diffusion_only/runs/diffusion_only/intermediate.csv
    --work-dir /workspace/proteobench_paired_stats_all7
    --cache-dir /workspace/paired_stats_cache
    --output-prefix instanovo_v1_2_2_paired_stats_all7
  types:
    worker:
      count: 1
      completions: 1
      parallelisms: 1
      resources:
        cpus: 8
        ramRatio: 4
