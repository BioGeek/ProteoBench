# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json
kind: AIchorManifest
apiVersion: 0.2.3
builder:
  image: proteobench-instanovo-v1-2-2
  dockerfile: ./aichor/instanovo_v1_2_2/Dockerfile
  context: .
spec:
  operator: jobset
  image: proteobench-instanovo-v1-2-2
  # InstaNovo+ standalone: `instanovo diffusion predict --no-refinement`, i.e. the full
  # reverse diffusion process from a uniform sample, with no transformer involved.
  # Runs inference and metrics in one job (the AIchor S3 auto-detection fix landed, so
  # `instanovo predict` no longer dies after inference).
  command: cd /workspace/ProteoBench/aichor/instanovo_v1_2_2 && python run_sweep.py --full --only diffusion_only --work-dir /workspace/proteobench_diffonly_rep3 --output-prefix instanovo_v1_2_2_diffusion_only_rep3
  types:
    worker:
      count: 1
      completions: 1
      parallelisms: 1
      resources:
        cpus: 24
        ramRatio: 8
        accelerators:
          gpu:
            count: 1
            type: gpu
            product: NVIDIA-H100-80GB-HBM3
