# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json
kind: AIchorManifest
apiVersion: 0.2.3
builder:
  image: proteobench-instanovo-v1-3-0
  dockerfile: ./aichor/instanovo_v1_3_0/Dockerfile
  context: .
spec:
  operator: jobset
  image: proteobench-instanovo-v1-3-0

  # Re-score predictions that already exist, with no GPU and no repeat of inference.
  #
  # greedy_refined (04c26560) finished inference and then died in the datapoint step on
  # ProteoBench's N-terminal length bug: two predictions carried carbamylation and ammonia loss
  # stacked on one terminus, where the length helper counted two scored positions and the
  # tokenizer counted one, so collapse_aa_scores raised "All arrays must be of the same length".
  # Fixed on this branch (cherry-pick of the upstream fix), so the existing raw_predictions.csv
  # can simply be re-scored.
  #
  # --metrics-from takes MODE=PATH and is repeatable, but only beam10_refined is listed here:
  #
  #   greedy_refined            already re-scored in 50a09a12; re-doing it wastes an hour of CPU
  #   beam10_refined            8bc22f0e failed exactly as predicted at 12:23 on 2026-08-18, after
  #                             20 h 17 m of inference, with "All arrays must be of the same
  #                             length". raw_predictions.csv (3.6 GiB) survived and there is no
  #                             datapoint.json, confirming only the datapoint step died. This is
  #                             the run being recovered.
  #   knapsack_beam10_refined   00238fba is still running (ETA ~04:00 on 2026-08-19) so its
  #                             predictions do not exist yet. It shares this pre-fix image and will
  #                             very likely fail the same way; re-score it in a second pass then.
  #
  # Add the other two back by uncommenting when their turn comes.
  command: >
    cd /workspace/ProteoBench/aichor/instanovo_v1_2_2 &&
    python run_sweep.py
    --metrics-from beam10_refined=s3://dtu-denovo-s-2e6da747d6d34f62-outputs/output/8bc22f0e-bb75-4952-9089-8e6fe69c4c6d/instanovo_v1_3_0_beam10_refined/runs/beam10_refined/samples/nine_species_balanced_De_Novo/raw_predictions.csv
    --work-dir /workspace/proteobench_v130_rescore
    --output-prefix instanovo_v1_3_0_rescored

  types:
    worker:
      count: 1
      completions: 1
      parallelisms: 1
      resources:
        cpus: 8
        ramRatio: 12
