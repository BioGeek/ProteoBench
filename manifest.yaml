# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json
kind: AIchorManifest
apiVersion: 0.2.3
builder:
  image: proteobench-internal-eval
  dockerfile: ./aichor/internal_eval/Dockerfile
  context: .
spec:
  operator: jobset
  image: proteobench-internal-eval

  # Score the completed held-out runs with ProteoBench's metrics. CPU only: this job reads
  # prediction CSVs and scores them, it runs no model.
  #
  # Datasets are streamed one at a time and deleted after scoring, so peak disk is one CSV
  # (~170 MB at the largest) rather than one run (~920 MB) or all six (~5.5 GB).
  #
  # Runs whose prefix does not exist are skipped with a warning, so this same command can be
  # re-issued unchanged as the remaining runs land.
  #
  # All eight completed runs, scored into ONE prefix. Earlier jobs split them: 65b8e552 wrote
  # four runs to `_scored`, then the two knapsack runs went to `_scored_knapsack` after they
  # crashed on `KeyError: 'U'` (ProteoBench's AA_MASSES covers only the 20 standard residues
  # and get_token_mass indexed it without a fallback, while the v1.3 133-residue vocabulary
  # includes selenocysteine and mass-constrained knapsack search emits it -- fixed in 520861a1
  # and 6625897d). That split is a trap: anyone reading `_scored/metrics.csv` alone silently
  # got four runs of six, and the next default-path job would have overwritten it. Re-scoring
  # the six already done costs about 15 minutes each and buys a single consolidated table.
  #
  # metrics.csv is written once after the loop, so a mid-job failure leaves the existing
  # `_scored/metrics.csv` untouched rather than replacing it with a partial result.
  command: >
    cd /workspace/ProteoBench/aichor/internal_eval &&
    python score_runs_aichor.py --save-intermediate
    --out s3://dtu-denovo-s-2e6da747d6d34f62-outputs/evaluation/_scored --runs
    instanovo_v1_3_133res_test_greedy
    instanovo_v1_3_133res_test_greedy_refined
    instanovo_v1_3_133res_test_beam5
    instanovo_v1_3_133res_test
    instanovo_v1_3_133res_test_knapsack_beam5_refined
    instanovo_v1_2_2_test_greedy
    instanovo_v1_2_2_test_beam5
    instanovo_v1_2_2_test_diffusion_only

  types:
    worker:
      count: 1
      completions: 1
      parallelisms: 1
      resources:
        cpus: 4
        ramRatio: 8
